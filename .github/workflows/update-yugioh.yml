name: Atualizar banco Yu-Gi-Oh

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_yugioh.py'
      - 'scripts/augment_multilingual_names.py'
      - '.github/workflows/update-yugioh.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: write

concurrency:
  group: yugioh-database-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sertao TCG database
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Japanese Yu-Gi-Oh card database
        run: |
          mkdir -p source/yugioh-ja
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/mycard/ygopro-database/master/locales/ja-JP/cards.cdb \
            -o source/yugioh-ja/cards.cdb

      - name: Build merged Yu-Gi-Oh database
        run: python scripts/build_yugioh.py

      - name: Add Portuguese, English and Japanese names
        run: python scripts/augment_multilingual_names.py yugioh

      - name: Commit database when changed
        run: |
          git config user.name "sertao-tcg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/yugioh.json
          if git diff --cached --quiet; then
            echo "Banco Yu-Gi-Oh ja esta atualizado."
          else
            git commit -m "Atualiza banco Yu-Gi-Oh"
            git pull --rebase origin main
            git push origin main
          fi
