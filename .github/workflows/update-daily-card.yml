name: Update Daily Card

on:
  workflow_dispatch:
  schedule:
    - cron: '10 3 * * *'
  push:
    paths:
      - 'data/*.json'
      - 'scripts/build_daily_card.py'
      - '.github/workflows/update-daily-card.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate compact daily card
        run: python scripts/build_daily_card.py
      - name: Commit payload when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/widgets/daily_card.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update daily card"
          git push
