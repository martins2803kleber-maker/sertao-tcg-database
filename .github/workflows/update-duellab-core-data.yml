name: Update Duel Lab core data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_duellab_core_data.py'
      - '.github/workflows/update-duellab-core-data.yml'
  schedule:
    - cron: '42 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch canonical card database and WindBot decks
        run: |
          git clone --depth 1 https://github.com/ProjectIgnis/BabelCDB.git /tmp/BabelCDB
          git clone --depth 1 https://github.com/ProjectIgnis/WindBot-Ignite.git /tmp/WindBot
      - name: Build browser core data
        run: |
          python scripts/build_duellab_core_data.py \
            --cdb /tmp/BabelCDB/cards.cdb \
            --windbot /tmp/WindBot \
            --out assets/duellab/core
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/duellab/core
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'duellab: update core card data and bot decks'
          git push
