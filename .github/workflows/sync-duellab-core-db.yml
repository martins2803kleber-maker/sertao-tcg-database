name: Sync Duel Lab Core DB

on:
  push:
    paths:
      - '.github/workflows/sync-duellab-core-db.yml'
      - '.github/duellab-core-db-trigger.txt'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 2,5'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar banco oficial Project Ignis
        run: |
          rm -rf /tmp/BabelCDB
          git clone --depth 1 https://github.com/ProjectIgnis/BabelCDB.git /tmp/BabelCDB

      - name: Gerar cards_core.json completo
        run: |
          python - <<'PY'
          import json, sqlite3, subprocess
          from pathlib import Path

          root=Path('/tmp/BabelCDB')
          # Master Rule / OCG-TCG databases. Rush/Skills/GOAT use rule/data sets
          # that should not silently override the normal Duel Lab database.
          files=[]
          canonical=root/'cards.cdb'
          if canonical.exists(): files.append(canonical)
          for p in sorted(root.glob('*.cdb')):
              n=p.name.lower()
              if p==canonical: continue
              if 'rush' in n or 'skill' in n or 'goat' in n: continue
              files.append(p)

          cards={}
          provenance={}
          TYPE_LINK=0x4000000
          MASK64=(1<<64)-1
          def split_setcodes(raw):
              raw=int(raw or 0)&MASK64
              out=[]
              for _ in range(4):
                  sc=raw&0xffff
                  if sc: out.append(sc)
                  raw >>= 16
              return out

          for db in files:
              try:
                  con=sqlite3.connect(f'file:{db}?mode=ro', uri=True)
                  cols=[x[1] for x in con.execute('pragma table_info(datas)')]
                  need={'id','alias','setcode','type','atk','def','level','race','attribute'}
                  if not need.issubset(cols):
                      con.close(); continue
                  for row in con.execute('select id,alias,setcode,type,atk,def,level,race,attribute from datas'):
                      cid,alias,setcode,ctype,atk,defense,levelraw,race,attribute=row
                      cid=int(cid); ctype=int(ctype or 0); levelraw=int(levelraw or 0)&0xffffffff
                      marker=0
                      defense=int(defense or 0)
                      if ctype & TYPE_LINK:
                          marker=defense & 0xffffffff
                          defense=0
                      cards[cid]={
                          'id':cid,
                          'alias':int(alias or 0),
                          'setcode':split_setcodes(setcode),
                          'type':ctype,
                          'level':levelraw & 0xff,
                          'attribute':int(attribute or 0)&0xffffffff,
                          'race':int(race or 0)&MASK64,
                          'atk':int(atk or 0),
                          'def':defense,
                          'lscale':(levelraw>>24)&0xff,
                          'rscale':(levelraw>>16)&0xff,
                          'link_marker':marker,
                      }
                      provenance[cid]=db.name
                  con.close()
              except sqlite3.DatabaseError as e:
                  print('skip',db.name,e)

          ordered=[cards[k] for k in sorted(cards)]
          out_web=Path('duellab/web/core/cards_core.json')
          out_assets=Path('assets/duellab/core/cards_core.json')
          out_web.parent.mkdir(parents=True,exist_ok=True)
          out_assets.parent.mkdir(parents=True,exist_ok=True)
          payload=json.dumps(ordered,separators=(',',':'),ensure_ascii=False)
          out_web.write_text(payload,encoding='utf-8')
          out_assets.write_text(payload,encoding='utf-8')
          upstream=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
          manifest={
              'source':'ProjectIgnis/BabelCDB',
              'upstream':upstream,
              'cardCount':len(ordered),
              'databases':[p.name for p in files],
          }
          Path('duellab/web/core/manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print('generated',len(ordered),'cards from',len(files),'databases',upstream)
          PY

      - name: Fazer o runtime usar o banco local e validar todos os IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('duellab/web/app.js')
          s=p.read_text(encoding='utf-8')
          marker='/* LOCAL PROJECT IGNIS CORE DB V1 */'
          if marker not in s:
              needle="    /* IDs exatos sempre vencem alias/baseId. */"
              patch=r'''    /* LOCAL PROJECT IGNIS CORE DB V1 */
    source=source.replace("fetch(REAL_BASE+'core/cards_core.json'+bust,{cache:'force-cache'})", "fetch('./core/cards_core.json',{cache:'no-cache'}).then(function(localResponse){if(localResponse.ok)return localResponse;return fetch(REAL_BASE+'core/cards_core.json'+bust,{cache:'force-cache'})})");
    source=source.replace("if(rec.length<Math.min(20,new Set(ids).size))throw Error('Dados do core incompletos para este deck.');", `var uniqueCoreIds=Array.from(new Set(ids.map(Number))).filter(Boolean);\n    var coreHave=new Set(rec.map(function(c){return Number(c.id)}));\n    var missingCoreIds=uniqueCoreIds.filter(function(id){return !coreHave.has(id)});\n    if(missingCoreIds.length)throw Error('Banco OCGCore sem dados para '+missingCoreIds.length+' carta(s): '+missingCoreIds.slice(0,20).join(', '));\n    log('<b>Core DB:</b> '+rec.length+' cartas do duelo validadas.');`);

'''
              if needle not in s: raise SystemExit('app.js marker not found')
              s=s.replace(needle,patch+needle,1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Validar JSON e runtime
        run: |
          python - <<'PY'
          import json
          p='duellab/web/core/cards_core.json'
          data=json.load(open(p,encoding='utf-8'))
          assert len(data)>10000, len(data)
          ids={int(x['id']) for x in data}
          assert len(ids)==len(data)
          for x in data[:1000]:
              for k in ('id','type','level','attribute','race','atk','def','lscale','rscale','link_marker','setcode'):
                  assert k in x,(x.get('id'),k)
          print('core db ok',len(data))
          PY
          node --check duellab/web/app.js
          cat duellab/web/chunks/*.txt > /tmp/duellab-runtime.js
          node --check /tmp/duellab-runtime.js

      - name: Commit sincronizacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add duellab/web/core/cards_core.json duellab/web/core/manifest.json assets/duellab/core/cards_core.json duellab/web/app.js
          git diff --cached --quiet || git commit -m "Atualiza banco OCGCore oficial e valida cartas do duelo"
          git push
