name: Build site-optimized card data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_site_data.py'
      - 'data/yugioh.json'
      - 'data/pokemon.json'
      - 'data/onepiece.json'
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact datasets and detail shards
        run: python scripts/build_site_data.py
      - name: Validate generated datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/site/manifest.json').read_text())
          for g in ('yugioh','pokemon','onepiece'):
              p=Path('data/site')/f'{g}.json'
              d=json.loads(p.read_text())
              assert isinstance(d.get('cards'),list) and len(d['cards'])>100
              assert m['games'][g]['cards']==len(d['cards'])
              print(g, len(d['cards']), p.stat().st_size, 'bytes')
          PY
      - name: Commit optimized data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/site
          if git diff --cached --quiet; then
            echo 'No site-data changes.'
          else
            git commit -m 'perf: rebuild site-optimized card data'
            git push
          fi
