name: Duel Lab hotfix card identity

on:
  push:
    paths:
      - '.github/duellab-hotfix-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app loader
        run: python scripts/hotfix_duellab_card_identity.py
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add duellab/web/app.js
          git diff --cached --quiet || git commit -m "Corrige associacao de cartas aos comandos legais do OCGCore"
          git push
