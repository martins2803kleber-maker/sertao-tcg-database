name: Atualizar banco One Piece

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_onepiece.py'
      - '.github/workflows/update-onepiece.yml'
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: write

concurrency:
  group: onepiece-database-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Sertao TCG database
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout One Piece multilingual fallback dataset
        uses: actions/checkout@v4
        with:
          repository: Kuroro1990/OPTCG
          path: source/optcg
          fetch-depth: 1

      - name: Checkout secondary English One Piece dataset
        uses: actions/checkout@v4
        with:
          repository: apitcg/one-piece-tcg-data
          path: source/apitcg
          fetch-depth: 1

      - name: Install vegapull
        run: cargo install vegapull --locked --version 1.3.0

      - name: Fetch latest English cards directly from Bandai
        run: |
          python source/optcg/build_punk_records.py \
            --vegapull "$(command -v vega)" \
            --language english \
            --out-dir source/live-optcg \
            --clean

      - name: Build merged One Piece database
        run: python scripts/build_onepiece.py

      - name: Commit database when changed
        run: |
          git config user.name "sertao-tcg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/onepiece.json
          if git diff --cached --quiet; then
            echo "Banco One Piece ja esta atualizado."
          else
            git commit -m "Atualiza banco One Piece"
            git pull --rebase origin main
            git push origin main
          fi
