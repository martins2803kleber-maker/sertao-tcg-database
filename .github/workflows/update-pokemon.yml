name: Atualizar banco Pokemon

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/build_pokemon.py'
      - 'scripts/augment_pokemon_upcoming.py'
      - 'scripts/augment_multilingual_names.py'
      - 'scripts/enrich_pokemon_descriptions.py'
      - 'scripts/finalize_pokemon_latest_effects.py'
      - 'scripts/filter_broken_pokemon_images.py'
      - '.github/workflows/update-pokemon.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: pokemon-database-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sertao TCG database
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout official Pokemon TCG data
        uses: actions/checkout@v4
        with:
          repository: PokemonTCG/pokemon-tcg-data
          path: source/pokemon-tcg-data
          fetch-depth: 1

      - name: Install Pokemon enrichment parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Build merged Pokemon database
        run: python scripts/build_pokemon.py

      - name: Add currently revealed Delta Reign and 30th Celebration cards
        run: python scripts/augment_pokemon_upcoming.py

      - name: Add Portuguese, English and Japanese names
        run: python scripts/augment_multilingual_names.py pokemon

      - name: Add card effects, descriptions and remove duplicate printings
        run: python scripts/enrich_pokemon_descriptions.py

      - name: Complete latest-set Trainer and English-number effect text
        run: python scripts/finalize_pokemon_latest_effects.py

      - name: Audit and remove remaining broken Pokemon images
        run: python scripts/filter_broken_pokemon_images.py

      - name: Commit database when changed
        run: |
          git config user.name "sertao-tcg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pokemon.json
          if git diff --cached --quiet; then
            echo "Banco Pokemon ja esta atualizado."
          else
            git commit -m "Atualiza banco Pokemon"
            git pull --rebase origin main
            git push origin main
          fi
