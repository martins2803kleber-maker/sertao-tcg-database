[package]
name = "duellab-engine"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ocgcore-ffi = { version = "0.1.4", features = ["bundled"] }
